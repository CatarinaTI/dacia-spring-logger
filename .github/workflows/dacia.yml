name: Dacia Spring Logger

on:
  workflow_dispatch: # Permite execução manual
  schedule:
    # Executar às 06:00, 14:00 e 22:00 (Hora de Lisboa)
    # Nota: O GitHub usa UTC. 
    # Inverno (UTC+0): 06:00 PT = 06:00 UTC
    # Verão (UTC+1): 06:00 PT = 05:00 UTC
    # Para simplificar e garantir que não falhamos dados, vamos usar horários fixos em UTC
    # que cubram os períodos pretendidos. Ajustaremos se necessário após os primeiros testes.
    - cron: '0 6,14,22 * * *' 

jobs:
  log-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Dacia Logger
        env:
          RENAULT_CREDENTIALS_JSON: ${{ secrets.RENAULT_CREDENTIALS_JSON }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_SECRET: ${{ secrets.APPS_SCRIPT_SECRET }}
        run: python main.py
